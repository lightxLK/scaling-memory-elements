name: Deploy library to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'library/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: library/package-lock.json
      # npm ci fails here: the lockfile was generated on Windows and is missing
      # Linux-only optional native binaries (rolldown-vite's platform binding
      # packages), so npm ci's exact-match check rejects it on this runner.
      # npm install resolves whatever the current platform actually needs.
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
